<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Manage Subscriptions</title></head>
<body>
<h1>Manage Subscription Plans</h1>
<table border="1">
    <thead><tr><th>Code</th><th>Name</th><th>Price</th><th>Active</th><th>Toggle</th></tr></thead>
    <tbody>
    <tr th:each="plan : ${plans}">
        <td th:text="${plan.code}"></td>
        <td th:text="${plan.name}"></td>
        <td th:text="${plan.monthlyPrice}"></td>
        <td th:text="${plan.active}"></td>
        <td>
            <form th:action="@{'/admin/subscriptions/' + ${plan.id} + '/toggle'}" method="post">
                <input type="hidden" name="active" th:value="${!plan.active}">
                <button type="submit" th:text="${plan.active ? 'Disable' : 'Enable'}"></button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<h2>Recruiter Subscriptions</h2>
<table border="1">
    <thead><tr><th>Recruiter</th><th>Plan</th><th>Status</th><th>Updated</th></tr></thead>
    <tbody>
    <tr th:each="subscription : ${subscriptions}">
        <td th:text="${subscription.recruiterProfileId}"></td>
        <td th:text="${subscription.planName}"></td>
        <td th:text="${subscription.status}"></td>
        <td th:text="${subscription.updatedAt}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
