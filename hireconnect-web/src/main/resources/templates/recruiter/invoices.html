<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Invoices</title></head>
<body>
<h1>Invoices</h1>
<table border="1">
    <thead><tr><th>Plan</th><th>Amount</th><th>Status</th><th>Issued</th><th>Due</th></tr></thead>
    <tbody>
    <tr th:each="invoice : ${invoices}">
        <td th:text="${invoice.planCode}"></td>
        <td th:text="${invoice.amount}"></td>
        <td th:text="${invoice.status}"></td>
        <td th:text="${invoice.issuedAt}"></td>
        <td th:text="${invoice.dueDate}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
