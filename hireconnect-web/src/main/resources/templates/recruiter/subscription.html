<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Manage Plan</title></head>
<body>
<h1>Manage Plan</h1>
<p th:if="${currentSubscription}" th:text="${currentSubscription.planName + ' - ' + currentSubscription.status}"></p>
<form th:action="@{/recruiter/subscription}" th:object="${subscriptionForm}" method="post">
    <select th:field="*{planCode}">
        <option th:each="plan : ${plans}" th:value="${plan.code}" th:text="${plan.name + ' - ' + plan.monthlyPrice}"></option>
    </select>
    <label>Auto renew <input type="checkbox" th:field="*{autoRenew}"></label>
    <button type="submit">Activate Plan</button>
</form>
</body>
</html>
