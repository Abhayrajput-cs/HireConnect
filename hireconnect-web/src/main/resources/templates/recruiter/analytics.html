<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Recruiter Analytics</title></head>
<body>
<h1>Recruiter Analytics</h1>
<p>Total Jobs: <span th:text="${summary.totalJobs}">0</span></p>
<p>Total Applications: <span th:text="${summary.totalApplications}">0</span></p>
<p>Shortlisted: <span th:text="${summary.shortlistedCount}">0</span></p>
<p>Offered: <span th:text="${summary.offeredCount}">0</span></p>
<p>Rejected: <span th:text="${summary.rejectedCount}">0</span></p>
<p>Avg Time To Hire: <span th:text="${timeToHire}">0</span></p>
<p>View To Apply Ratio: <span th:text="${summary.viewToApplyRatio}">0</span></p>
<h2>Top Categories</h2>
<ul><li th:each="entry : ${topCategories}" th:text="${entry.key + ': ' + entry.value}"></li></ul>
</body>
</html>
