spring.application.name=auth-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hireconnect_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email

server.port=${SERVER_PORT:8081}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

app.security.jwt.issuer=hireconnect-auth-service
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=PT24H
app.security.jwt.refresh-token-ttl=P30D

app.oauth2.default-success-url=${OAUTH2_DEFAULT_SUCCESS_URL:http://localhost:3000/oauth2/callback}
app.oauth2.cookie-expiry-seconds=180
