spring.application.name=auth-service
spring.config.import=optional:file:.secrets/local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hireconnect_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Abhay@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:local-github-client}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:local-github-secret}
spring.security.oauth2.client.registration.github.scope=user:email

server.port=${SERVER_PORT:8081}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

app.security.jwt.issuer=hireconnect-auth-service
app.security.jwt.secret=${JWT_SECRET:VGhpc0lzQVRlc3RTZWNyZXRGb3JBdXRoU2VydmljZUxvY2FsRGV2T25seTEyMzQ1Njc4OTAxMjM0NTY=}
app.security.jwt.access-token-ttl=PT24H
app.security.jwt.refresh-token-ttl=P30D

app.oauth2.default-success-url=${OAUTH2_DEFAULT_SUCCESS_URL:http://localhost:3000/oauth2/callback}
app.oauth2.cookie-expiry-seconds=180
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin.hireconnect.com}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Abhay@1234}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
management.health.mail.enabled=false
