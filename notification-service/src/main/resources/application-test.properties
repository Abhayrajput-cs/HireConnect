spring.datasource.url=jdbc:h2:mem:hireconnect_notification;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

app.security.enabled=true
app.messaging.enabled=false
app.mail.enabled=false
app.services.auth.base-url=http://localhost:8081
app.services.profile.base-url=http://localhost:8084
app.services.job.base-url=http://localhost:8085
app.services.application.base-url=http://localhost:8086
app.services.interview.base-url=http://localhost:8087
management.health.mail.enabled=false
