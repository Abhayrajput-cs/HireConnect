spring.application.name=notification-service
spring.config.import=optional:file:.secrets/local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hireconnect_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

server.port=${SERVER_PORT:8088}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.security.enabled=${SECURITY_ENABLED:true}
app.security.jwt.issuer=${JWT_ISSUER:hireconnect-auth-service}
app.security.jwt.secret=${JWT_SECRET:VGhpc0lzQVRlc3RTZWNyZXRGb3JBdXRoU2VydmljZUxvY2FsRGV2T25seTEyMzQ1Njc4OTAxMjM0NTY=}

app.services.auth.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8081}
app.services.profile.base-url=${PROFILE_SERVICE_BASE_URL:http://localhost:8084}
app.services.job.base-url=${JOB_SERVICE_BASE_URL:http://localhost:8085}
app.services.application.base-url=${APPLICATION_SERVICE_BASE_URL:http://localhost:8086}
app.services.interview.base-url=${INTERVIEW_SERVICE_BASE_URL:http://localhost:8087}
app.cache.redis.ttl=${REDIS_CACHE_TTL:PT5M}

app.messaging.enabled=${MESSAGING_ENABLED:true}
app.messaging.exchange=${NOTIFICATION_EXCHANGE:hireconnect.events}
app.messaging.queue=${NOTIFICATION_QUEUE:hireconnect.notification.queue}
app.messaging.routing-key=${NOTIFICATION_ROUTING_KEY:hireconnect.notification.#}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.missing-queues-fatal=false

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@hireconnect.local}
app.mail.enabled=${MAIL_ENABLED:false}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
