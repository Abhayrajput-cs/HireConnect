spring.application.name=profile-service
spring.config.import=optional:file:.secrets/local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hireconnect_profile?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Abhay@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.cache.type=${CACHE_TYPE:simple}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

server.port=${SERVER_PORT:8084}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.security.enabled=${SECURITY_ENABLED:true}
app.security.jwt.issuer=${JWT_ISSUER:hireconnect-auth-service}
app.security.jwt.secret=${JWT_SECRET:VGhpc0lzQVRlc3RTZWNyZXRGb3JBdXRoU2VydmljZUxvY2FsRGV2T25seTEyMzQ1Njc4OTAxMjM0NTY=}
app.services.auth.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8081}
app.cache.redis.ttl=${REDIS_CACHE_TTL:PT5M}
app.files.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.files.resume-dir=${RESUME_UPLOAD_DIR:uploads/resumes}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}
