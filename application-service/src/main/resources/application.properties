spring.application.name=application-service
spring.config.import=optional:file:.secrets/local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hireconnect_application?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8086}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

app.security.enabled=${SECURITY_ENABLED:true}
app.security.jwt.issuer=${JWT_ISSUER:hireconnect-auth-service}
app.security.jwt.secret=${JWT_SECRET:VGhpc0lzQVRlc3RTZWNyZXRGb3JBdXRoU2VydmljZUxvY2FsRGV2T25seTEyMzQ1Njc4OTAxMjM0NTY=}
app.services.auth.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8081}
app.services.profile.base-url=${PROFILE_SERVICE_BASE_URL:http://localhost:8084}
app.services.job.base-url=${JOB_SERVICE_BASE_URL:http://localhost:8085}
app.messaging.enabled=${MESSAGING_ENABLED:true}
app.messaging.exchange=${NOTIFICATION_EXCHANGE:hireconnect.events}
app.messaging.routing-key=${APPLICATION_NOTIFICATION_ROUTING_KEY:hireconnect.notification.application}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
