spring.application.name=payment-service
spring.config.import=optional:file:.secrets/local.properties

server.port=${SERVER_PORT:8089}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hireconnect_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
